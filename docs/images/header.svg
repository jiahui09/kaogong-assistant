      <rect x="27" y="288" width="286" height="38" rx="8" fill="#fff" stroke="#d6e1ec"/><circle cx="47" cy="307" r="8" fill="none" stroke="#b3c4d4" stroke-width="2"/><rect x="65" y="303" width="174" height="8" rx="4" fill="#d6e1ec"/>
      <text x="346" y="211" fill="#60778c" font-size="15">错题目录 · 六列切题</text>
